name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Params mirror is current
        run: |
          dart run tools/gen_params.dart
          git diff --exit-code -- packages/stadtbau_sim/lib/src/generated/default_params.dart

      - name: Localizations
        run: cd app && flutter gen-l10n

      # The relay resolves on its own, outside the workspace, so it builds with
      # the Dart SDK alone (packages/stadtbau_relay/pubspec.yaml).
      - name: Relay dependencies
        run: cd packages/stadtbau_relay && dart pub get

      - name: Analyze
        run: |
          (cd packages/stadtbau_sim && dart analyze --fatal-infos)
          (cd packages/stadtbau_net && dart analyze --fatal-infos)
          (cd packages/stadtbau_relay && dart analyze --fatal-infos)
          (cd app && flutter analyze --fatal-infos)

      # Relay play is left out of the App Store builds for now; both of their
      # build commands must pass the switch that does it.
      - name: App Store builds leave relays out
        run: tools/check.sh store-flags

      - name: Test simulation
        run: cd packages/stadtbau_sim && dart test

      # The co-op protocol and its end-to-end encryption, including a real
      # session through a real relay over local sockets (T-606).
      - name: Test co-op protocol and relay
        run: |
          (cd packages/stadtbau_net && dart test)
          (cd packages/stadtbau_relay && dart test)

      # The same code compiled to JavaScript, as the web build runs it: the
      # world hash must agree with a native peer's, and the sealed channel must
      # work without 64-bit integers. Neither shows up in the VM.
      - name: Test co-op code in a browser
        run: |
          (cd packages/stadtbau_sim && dart test -p chrome test/hash_test.dart)
          (cd packages/stadtbau_net && dart test -p chrome test/secure_channel_test.dart test/protocol_test.dart)

      - name: Test app
        run: cd app && flutter test

      # The same app built without relay play, as the App Store builds are
      # (app/lib/game/build_features.dart): no relay option, relay codes refused.
      - name: Test app without relays
        run: cd app && flutter test --dart-define=HECTOPOLIS_RELAY=false test/relay_switch_test.dart

      # The bundled Roboto is subset to the characters the app can display; a
      # glyph it lacks becomes a request to Google, not a blank on screen.
      - name: Fonts are the committed subset
        run: |
          python3 -m pip install --quiet fonttools
          python3 tools/subset_fonts.py --check \
            --sdk-fonts "${FLUTTER_ROOT}/bin/cache/artifacts/material_fonts"

      - name: i18n lint
        run: dart run tools/i18n_lint.dart

      # The lint above compares keys. This compares the branches inside each
      # ICU select, where a missing id renders the generic wording instead of
      # failing, and replays every mission to check its teaching content is
      # reachable.
      - name: Learning audit
        run: cd packages/stadtbau_sim && dart run tool/learning_audit.dart --paths 8

      - name: License audit
        run: |
          tools/license_audit.sh
          git diff --exit-code -- THIRD_PARTY.md || echo "THIRD_PARTY.md changed; commit it"

      # Every other accessibility test asserts Flutter's own semantics tree
      # from inside the process. This one reads what a screen reader is
      # actually handed: the real Linux build, under Xvfb, published through
      # GTK's ATK bridge onto an AT-SPI bus, walked by a D-Bus client. It is
      # the difference between "we labelled it" and "an assistive technology
      # receives the label".
      - name: Accessibility probe (AT-SPI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq at-spi2-core xvfb dbus-x11 \
            libgtk-3-dev ninja-build clang cmake pkg-config liblzma-dev
          python3 -m pip install --quiet jeepney
          cd app && flutter build linux --debug && cd ..
          python3 tools/a11y_probe.py \
            --bundle app/build/linux/x64/debug/bundle/hectopolis \
            --expect "How Hectopolis works|So funktioniert Hectopolis" \
            --expect "Skip|Überspringen" \
            --expect "Next|Weiter" \
            --min-nodes 15

      - name: Build web
        # Same engine hosting as the deploy (see pages.yml), so CI exercises
        # the configuration that actually ships.
        run: cd app && flutter build web --release --no-web-resources-cdn

      # The web build must fetch nothing from anyone but us (T-702). What
      # breaks that is not a new dependency but a character: CanvasKit fetches
      # a fallback font for any glyph the bundled fonts lack. Chrome is run
      # with every host but 127.0.0.1 resolving to nothing, so a third-party
      # fetch fails and is reported rather than quietly succeeding.
      - name: Web origin check
        run: |
          python3 -m pip install --quiet websockets
          python3 tools/web_origin_check.py --build app/build/web \
            --shot "${RUNNER_TEMP}/web-origin.png"

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/build/web
          retention-days: 14

  # The self-hostable relay (T-606) as people will run it: the image builds
  # from its Dockerfile with nothing but the Dart SDK, starts, and answers.
  relay-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build the relay image
        run: docker build -t hectopolis-relay packages/stadtbau_relay

      - name: The image starts and answers
        run: |
          docker run -d --name relay -p 8080:8080 hectopolis-relay
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then exit 0; fi
            sleep 1
          done
          docker logs relay
          exit 1
