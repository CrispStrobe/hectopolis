name: appstore-prepare

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Audit, prepare App Store listing, or submit a build for TestFlight review'
        type: choice
        options: [audit, listing, ready-store, submit-external, beta-links, beta-link-enable]
        default: audit
      build_number:
        description: 'Optional exact CFBundleVersion; blank selects the newest build'
        type: string
        required: false
      app_id:
        description: 'beta-link-enable only: the app whose public link to turn on; blank means this app'
        type: string
        required: false
      platform:
        description: 'Apple platform whose build/version should be prepared'
        type: choice
        options: [IOS, MAC_OS]
        default: IOS

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet --disable-pip-version-check cryptography
      - name: Audit or prepare TestFlight
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ACTION: ${{ inputs.action }}
          APP_ID: ${{ inputs.app_id }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          args=("$ACTION")
          args+=(--platform "$PLATFORM")
          if [ -n "$BUILD_NUMBER" ]; then
            args+=(--build-number "$BUILD_NUMBER")
          fi
          if [ "$ACTION" = listing ]; then
            python3 tools/asc/listing.py
          elif [ "$ACTION" = beta-link-enable ]; then
            # Turns ON one app's public link. A public link is a URL anyone can
            # use to join the beta, and one that has been handed out cannot be
            # recalled by turning the flag off, so this can only ever act on a
            # single named app -- never the portfolio.
            python3 tools/asc/beta_links.py enable \
              --app "${APP_ID:-$ASC_APP_ID}"
          elif [ "$ACTION" = beta-links ]; then
            # Read-only: reports every app's external groups and whether a
            # public link exists. Turning one ON is deliberately not reachable
            # from this workflow -- a public link is a URL anyone can use to
            # join, and one that has been handed out cannot be recalled.
            python3 tools/asc/beta_links.py list
          else
            python3 tools/asc/testflight.py "${args[@]}"
          fi
