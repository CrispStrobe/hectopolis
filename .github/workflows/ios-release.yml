name: ios-release

# Hectopolis — build, sign and upload the iOS App Store binary.
#
# Triggers
#   * push of a `v*` tag  -> full build + upload to App Store Connect
#   * "Run workflow"      -> dry_run defaults to TRUE: build, sign, validate and
#                            keep the .ipa as a workflow artifact, never upload.
#
# Repo secrets (all eight are required; the preflight step fails loudly if one
# is missing, see docs/release/ios.md for how to create each):
#   ASC_API_KEY_P8_BASE64  base64 of AuthKey_<ASC_KEY_ID>.p8
#   ASC_KEY_ID             App Store Connect API key id
#   ASC_ISSUER_ID          App Store Connect issuer id (UUID)
#   ASC_APP_ID             numeric Apple ID of the app record
#   ASC_TEAM_ID            Apple Developer team id (N9XSJ4M3GT)
#   DIST_CERT_P12_BASE64   base64 of the "Apple Distribution" .p12 (cert + key)
#   DIST_CERT_PASSWORD     password of that .p12
#   ASC_PROFILE_BASE64     base64 of the IOS_APP_STORE .mobileprovision
#
# Two things this workflow deliberately never does, both hard-won:
#   * `flutter build ipa` — forces AUTOMATIC signing, which needs an Xcode
#     account. A headless runner has none, the archive fails with "No profiles
#     for 'com.crispstrobe.hectopolis' were found", and the job used to go green
#     having uploaded nothing.
#   * `-allowProvisioningUpdates` — on a runner it mints a Development
#     certificate and, to stay under Apple's five-certificate limit, silently
#     REVOKES the shared Apple Distribution certificate, breaking signing for
#     every app on the account.
# Every signing and upload step is therefore fail-loud: no `continue-on-error`,
# so a green run can never again mean "nothing was uploaded".
#
# The build number comes from app/pubspec.yaml (`version: X.Y.Z+BUILD`). Bump
# BUILD before tagging or Apple rejects the duplicate CFBundleVersion; bump
# X.Y.Z too once the previous marketing version was approved (ITMS-90062).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, sign and validate only — do NOT upload to App Store Connect'
        type: boolean
        default: true

# Nothing here writes to the repository; the .ipa goes to an artifact and to
# App Store Connect.
permissions:
  contents: write

# Never cancel a run that may be mid-upload: a half-delivered build number is
# burnt either way, and two tags racing is rarer than one upload being killed.
concurrency:
  group: ios-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.1'
  # ExportOptions.plist selects the profile by name; assert the secret matches.
  PROFILE_NAME: Hectopolis AppStore CI
  # A tag push is always a real release; a manual run honours the input, which
  # defaults to a dry run.
  DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}

jobs:
  build-upload:
    name: Build, sign and upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # `if: ${{ secrets.X != '' }}` is rejected by GitHub ("Unrecognized named-
      # value: 'secrets'" — the secrets context is not available in a job- or
      # step-level `if`). Copy the emptiness test into plain env vars instead,
      # and fail here rather than silently skipping signing later.
      - name: Preflight — required secrets are present
        env:
          HAS_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
          HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ISSUER: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_APP_ID: ${{ secrets.ASC_APP_ID != '' }}
          HAS_TEAM: ${{ secrets.ASC_TEAM_ID != '' }}
          HAS_P12: ${{ secrets.DIST_CERT_P12_BASE64 != '' }}
          HAS_P12_PW: ${{ secrets.DIST_CERT_PASSWORD != '' }}
          HAS_PROFILE: ${{ secrets.ASC_PROFILE_BASE64 != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_KEY"     = true ] || missing="$missing ASC_API_KEY_P8_BASE64"
          [ "$HAS_KEY_ID"  = true ] || missing="$missing ASC_KEY_ID"
          [ "$HAS_ISSUER"  = true ] || missing="$missing ASC_ISSUER_ID"
          [ "$HAS_APP_ID"  = true ] || missing="$missing ASC_APP_ID"
          [ "$HAS_TEAM"    = true ] || missing="$missing ASC_TEAM_ID"
          [ "$HAS_P12"     = true ] || missing="$missing DIST_CERT_P12_BASE64"
          [ "$HAS_P12_PW"  = true ] || missing="$missing DIST_CERT_PASSWORD"
          [ "$HAS_PROFILE" = true ] || missing="$missing ASC_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — see docs/release/ios.md"
            exit 1
          fi
          echo "All eight signing secrets are set. dry_run=$DRY_RUN"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Flutter 3.44 puts plugins in a local Swift Package while the Podfile
      # still installs the same plugins, so a bare `xcodebuild archive` dies
      # with `error: redefinition of '<plugin symbol>'`. The SPM references are
      # stripped from app/ios/Runner.xcodeproj/project.pbxproj; this stops the
      # toolchain from adding them back on the runner.
      - name: Use pure CocoaPods (no Swift Package Manager)
        run: flutter config --no-enable-swift-package-manager

      # Pub workspace: resolve from the repo root, generate localisations in app/.
      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localisations
        run: cd app && flutter gen-l10n

      - name: Import the Apple Distribution certificate into a fresh keychain
        env:
          P12_B64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/hectopolis-signing.keychain-db"
          KC_PW="ci-$(uuidgen)"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"
          # APPEND to the user search list (keep the default login keychain on
          # it) — replacing it outright breaks other tools on the runner.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Without a partition list, codesign blocks on an interactive "allow
          # access?" prompt that a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "::error::DIST_CERT_P12_BASE64 contains no Apple Distribution identity."; exit 1; }

      - name: Install the App Store provisioning profile
        env:
          PROFILE_B64: ${{ secrets.ASC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE="$RUNNER_TEMP/hectopolis.mobileprovision"
          PLIST="$RUNNER_TEMP/hectopolis-profile.plist"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          # A .mobileprovision is a CMS-signed plist; unwrap it, then read the
          # keys with plutil.
          security cms -D -i "$PROFILE" > "$PLIST"
          UUID="$(plutil -extract UUID raw -o - "$PLIST")"
          NAME="$(plutil -extract Name raw -o - "$PLIST")"
          echo "profile '$NAME' ($UUID)"
          # Xcode 16/26 moved the profile directory; install into BOTH, named
          # <UUID>.mobileprovision, or -exportArchive reports "no profiles were
          # found" for a profile that is plainly on disk.
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            cp "$PROFILE" "$DIR/$UUID.mobileprovision"
          done
          # ExportOptions.plist selects the profile by NAME. A mismatch is the
          # difference between a signed .ipa and an hour of confusion.
          if [ "$NAME" != "$PROFILE_NAME" ]; then
            echo "::error::Profile in ASC_PROFILE_BASE64 is named '$NAME' but app/ios/ExportOptions.plist expects '$PROFILE_NAME'."
            exit 1
          fi
          # Advisory: the profile must be bound to the very certificate we just
          # imported, or -exportArchive fails with `profile "..." doesn't
          # include signing certificate`. Compare SHA-1 fingerprints.
          IDENT_SHA="$(security find-identity -v -p codesigning \
            | grep 'Apple Distribution' | head -1 | awk '{print $2}' || true)"
          i=0
          match=no
          while CERT="$(plutil -extract "DeveloperCertificates.$i" raw -o - "$PLIST" 2>/dev/null)"; do
            SHA="$(echo "$CERT" | base64 --decode 2>/dev/null \
              | openssl x509 -inform DER -noout -fingerprint -sha1 2>/dev/null \
              | sed 's/.*=//; s/://g' || true)"
            echo "  profile cert $i: ${SHA:-<unreadable>}"
            if [ -n "$SHA" ] && [ "$SHA" = "$IDENT_SHA" ]; then match=yes; fi
            i=$((i + 1))
          done
          if [ "$match" != yes ]; then
            echo "::warning::The provisioning profile does not list the imported Apple Distribution certificate ($IDENT_SHA). Export will most likely fail with \"doesn't include signing certificate\" — re-issue the profile against this certificate."
          fi

      - name: Write the App Store Connect API key
        env:
          P8_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$P8_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          head -1 "$KEY" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::ASC_API_KEY_P8_BASE64 does not decode to a PEM private key."; exit 1; }

      # One implementation of the build recipe, shared with a developer Mac:
      # `flutter build ios --config-only` + `pod install`, an UNSIGNED
      # `xcodebuild clean archive`, then `-exportArchive` with
      # app/ios/ExportOptions.plist applying the Distribution signing.
      # Never uploads here — the upload is its own, clearly gated step below.
      - name: Archive, export and validate
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: bash tools/ios/build-ios-appstore.sh --no-upload

      # Runs on a dry run too — that is the point of a dry run. `error` on no
      # files: an export that produced nothing must not pass as success.
      - name: Upload the .ipa as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: hectopolis-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: bash tools/ios/build-ios-appstore.sh --upload-only

      - name: Attach to GitHub release
        if: ${{ env.DRY_RUN != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/build/ios/ipa/*.ipa

      - name: Summary
        if: always()
        run: |
          VER=$(sed -n 's/^version:[[:space:]]*\([^+]*\)+.*$/\1/p' app/pubspec.yaml | head -1)
          BUILD=$(sed -n 's/^version:[[:space:]]*[^+]*+\(.*\)$/\1/p' app/pubspec.yaml | head -1)
          {
            echo "### Hectopolis iOS $VER (build $BUILD)"
            echo
            if [ "$DRY_RUN" = 'true' ]; then
              echo "Dry run: built, signed and validated. **Nothing was uploaded.**"
              echo "The signed .ipa is attached as the \`hectopolis-ios-ipa\` artifact."
            elif [ '${{ job.status }}' = 'success' ]; then
              echo "Uploaded to App Store Connect. Apple needs a few minutes to"
              echo "process the build before it appears in TestFlight."
              echo
              echo "Still human-only: privacy label, age rating and Submit for Review."
            else
              echo "Something did not complete — check the steps above."
              echo "If the upload itself failed, re-run with \`dry_run: false\`;"
              echo "the build number must still be unused (bump it in app/pubspec.yaml)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
