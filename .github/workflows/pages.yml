name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: cd app && flutter gen-l10n
      - name: Build web
        run: cd app && flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # Unless the build sets useLocalCanvasKit, flutter.js loads the engine
      # from https://www.gstatic.com/flutter-canvaskit/<revision>/, so the
      # canvaskit/ directory Flutter also writes -- 22 MB of the 24 MB build,
      # every engine variant plus a .symbols map each -- is never requested.
      # Verified against the access log of a headless Chrome load: it fetches
      # flutter_bootstrap.js, main.dart.js, the manifests and the icon font,
      # and nothing under canvaskit/. The guard keeps the directory if the
      # build is ever switched to --no-web-resources-cdn, which self-hosts the
      # engine and does request it.
      - name: Drop the unused engine copy from the artifact
        run: |
          before=$(du -sm app/build/web | cut -f1)
          if grep -q '"useLocalCanvasKit":true' app/build/web/flutter_bootstrap.js; then
            echo "build self-hosts the engine; keeping canvaskit/"
            find app/build/web -name '*.symbols' -delete
          else
            rm -rf app/build/web/canvaskit
          fi
          echo "artifact: ${before} MB -> $(du -sm app/build/web | cut -f1) MB"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
