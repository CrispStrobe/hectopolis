name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - run: flutter pub get
      - run: cd app && flutter gen-l10n
      - name: Build web
        run: cd app && flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # CanvasKit ships a .symbols map next to every engine variant -- about
      # 8 MB, a third of the build -- for symbolising engine stack traces
      # offline. Nothing in flutter.js or the bundle ever requests one, so
      # they are pure upload, storage and Pages quota.
      - name: Drop engine debug symbols from the artifact
        run: |
          before=$(du -sm app/build/web | cut -f1)
          find app/build/web -name '*.symbols' -delete
          echo "artifact: ${before} MB -> $(du -sm app/build/web | cut -f1) MB"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
