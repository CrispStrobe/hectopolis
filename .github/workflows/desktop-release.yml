name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            output_dir: app/build/linux/x64/release/bundle
            zip_cmd: zip -r $GITHUB_WORKSPACE/dist/hectopolis-linux.zip .
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            output_dir: app/build/macos/Build/Products/Release
            zip_cmd: zip -r $GITHUB_WORKSPACE/dist/hectopolis-macos.zip Hectopolis.app
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            output_dir: app/build/windows/x64/runner/Release
            zip_cmd: Compress-Archive -Path * -DestinationPath $env:GITHUB_WORKSPACE\dist\hectopolis-windows.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev pkg-config

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Dependencies
        run: flutter pub get
        shell: bash

      - name: Localizations
        run: |
          cd app
          flutter gen-l10n
        shell: bash

      - name: Build
        run: |
          cd app
          ${{ matrix.build_cmd }}
        shell: bash

      - name: Package (Unix)
        if: matrix.target != 'windows'
        run: |
          mkdir -p $GITHUB_WORKSPACE/dist
          cd ${{ matrix.output_dir }}
          ${{ matrix.zip_cmd }}
        shell: bash

      - name: Package (Windows)
        if: matrix.target == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist
          cd ${{ matrix.output_dir }}
          ${{ matrix.zip_cmd }}
        shell: powershell

      # The zip is the raw bundle; the AppImage is the thing a Linux user can
      # download and run without installing anything.
      - name: Package AppImage (Linux)
        if: matrix.target == 'linux'
        run: tools/package_appimage.sh "$GITHUB_WORKSPACE/dist"
        shell: bash

      # Manual dispatch is the cross-platform dry run. Keep its output useful
      # without creating a GitHub release; tag builds still attach the same
      # files below.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hectopolis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
