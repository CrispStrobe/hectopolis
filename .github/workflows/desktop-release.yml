name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            build_cmd: flutter build linux --release
            output_dir: app/build/linux/x64/release/bundle
            zip_cmd: zip -r $GITHUB_WORKSPACE/dist/hectopolis-linux.zip .
          - os: macos-latest
            target: macos
            build_cmd: flutter build macos --release
            output_dir: app/build/macos/Build/Products/Release
            zip_cmd: zip -r $GITHUB_WORKSPACE/dist/hectopolis-macos.zip Hectopolis.app
          - os: windows-latest
            target: windows
            build_cmd: flutter build windows --release
            output_dir: app/build/windows/x64/runner/Release
            zip_cmd: Compress-Archive -Path * -DestinationPath $env:GITHUB_WORKSPACE\dist\hectopolis-windows.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux Dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ninja-build libgtk-3-dev pkg-config xvfb
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive --user flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Dependencies
        run: flutter pub get
        shell: bash

      - name: Localizations
        run: |
          cd app
          flutter gen-l10n
        shell: bash

      - name: Build
        run: |
          cd app
          ${{ matrix.build_cmd }}
        shell: bash

      - name: Package (Unix)
        if: matrix.target != 'windows'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd ${{ matrix.output_dir }}
          ${{ matrix.zip_cmd }}
        shell: bash

      - name: Package (Windows)
        if: matrix.target == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path $env:GITHUB_WORKSPACE\dist
          cd ${{ matrix.output_dir }}
          ${{ matrix.zip_cmd }}
        shell: powershell

      # This proves the MSIX recipe on a real Windows runner. The msix package's
      # bundled certificate is a public development key, so this artifact is
      # deliberately separate from dist/ and is never attached to a release.
      - name: Package and validate MSIX (Windows test certificate)
        if: matrix.target == 'windows'
        run: |
          $versionLine = Select-String -Path app/pubspec.yaml -Pattern '^version:\s*(.+)$'
          if ($null -eq $versionLine) {
            throw 'No version found in app/pubspec.yaml'
          }
          $pubVersion = $versionLine.Matches[0].Groups[1].Value.Trim()
          $versionParts = $pubVersion -split '\+'
          $buildNumber = if ($versionParts.Length -gt 1) { $versionParts[1] } else { '0' }
          $msixVersion = "$($versionParts[0]).$buildNumber"
          if ($msixVersion -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Cannot convert pub version '$pubVersion' to an MSIX version"
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'msix-dist'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          Push-Location app
          dart run msix:create `
            --version $msixVersion `
            --output-path $outputDir `
            --output-name "hectopolis-windows-$msixVersion-test-signed"
          if ($LASTEXITCODE -ne 0) {
            throw "msix:create failed with exit code $LASTEXITCODE"
          }
          Pop-Location

          $packages = @(Get-ChildItem -Path $outputDir -Filter '*.msix')
          if ($packages.Count -ne 1) {
            throw "Expected exactly one MSIX in $outputDir, found $($packages.Count)"
          }
          $package = $packages[0]

          $makeAppx = Get-ChildItem `
            -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $makeAppx) {
            throw 'Could not find makeappx.exe in the Windows SDK'
          }
          $unpacked = Join-Path $env:RUNNER_TEMP 'hectopolis-msix-unpacked'
          & $makeAppx.FullName unpack /p $package.FullName /d $unpacked
          if ($LASTEXITCODE -ne 0) {
            throw "MakeAppx validation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path (Join-Path $unpacked 'AppxManifest.xml'))) {
            throw 'The MSIX has no AppxManifest.xml'
          }
          if (-not (Test-Path (Join-Path $unpacked 'hectopolis.exe'))) {
            throw 'The MSIX has no hectopolis.exe'
          }

          $signature = Get-AuthenticodeSignature $package.FullName
          if ($null -eq $signature.SignerCertificate) {
            throw 'The MSIX has no signer certificate'
          }
          if ($signature.SignerCertificate.NotAfter -le (Get-Date)) {
            throw 'The MSIX test certificate has expired'
          }
          Write-Output "MSIX: $($package.Name) ($($package.Length) bytes)"
          Write-Output "Signer: $($signature.SignerCertificate.Subject)"
          Write-Output "Signature status: $($signature.Status) (untrusted is expected for the test certificate)"
        shell: powershell

      # The zip is the raw bundle; the AppImage is the thing a Linux user can
      # download and run without installing anything.
      - name: Package AppImage (Linux)
        if: matrix.target == 'linux'
        run: tools/package_appimage.sh "$GITHUB_WORKSPACE/dist"
        shell: bash

      - name: Package and smoke-test Flatpak (Linux)
        if: matrix.target == 'linux'
        run: |
          tools/package_flatpak.sh "$GITHUB_WORKSPACE/dist"
          flatpak install --noninteractive --user "$GITHUB_WORKSPACE"/dist/*.flatpak
          set +e
          timeout 15s xvfb-run -a flatpak run com.crispstrobe.hectopolis
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Flatpak exited during its launch smoke test (status $status)" >&2
            exit "$status"
          fi
          flatpak info --user --show-permissions com.crispstrobe.hectopolis
        shell: bash

      # Manual dispatch is the cross-platform dry run. Keep its output useful
      # without creating a GitHub release; tag builds still attach the same
      # files below.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hectopolis-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSIX validation artifact
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: hectopolis-windows-msix-test-signed
          path: msix-dist/*.msix
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
