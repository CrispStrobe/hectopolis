name: Transfer CrispChess installer key

on:
  workflow_dispatch:
    inputs:
      repository_public_key:
        description: Base64 public key returned by the CrispChess Actions secrets API
        required: true
        type: string
      repository_public_key_id:
        description: Public key ID returned by the CrispChess Actions secrets API
        required: true
        type: string

permissions:
  contents: read

jobs:
  seal-secret:
    name: Seal installer key for CrispChess
    runs-on: ubuntu-latest
    steps:
      - name: Install sealed-box support
        run: python3 -m pip install --quiet --disable-pip-version-check pynacl
      - name: Encrypt for the CrispChess repository
        env:
          INSTALLER_KEY: ${{ secrets.MAC_INSTALLER_KEY_PEM_BASE64 }}
          REPOSITORY_PUBLIC_KEY: ${{ inputs.repository_public_key }}
          REPOSITORY_PUBLIC_KEY_ID: ${{ inputs.repository_public_key_id }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          from nacl.public import PublicKey, SealedBox

          if not os.environ.get("INSTALLER_KEY"):
              raise SystemExit("MAC_INSTALLER_KEY_PEM_BASE64 is missing")

          public_key = PublicKey(base64.b64decode(os.environ["REPOSITORY_PUBLIC_KEY"]))
          ciphertext = SealedBox(public_key).encrypt(
              os.environ["INSTALLER_KEY"].encode()
          )
          pathlib.Path("crispchess-installer-key.json").write_text(
              json.dumps({
                  "key_id": os.environ["REPOSITORY_PUBLIC_KEY_ID"],
                  "encrypted_value": base64.b64encode(ciphertext).decode(),
              })
          )
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: crispchess-sealed-installer-key
          path: crispchess-installer-key.json
          retention-days: 1
          if-no-files-found: error
