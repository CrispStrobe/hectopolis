name: Transfer CrispChess installer key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-secret:
    name: Seal installer key for CrispChess
    runs-on: ubuntu-latest
    steps:
      - name: Install sealed-box support
        run: python3 -m pip install --quiet --disable-pip-version-check pynacl
      - name: Encrypt for the CrispChess repository
        env:
          INSTALLER_KEY: ${{ secrets.MAC_INSTALLER_KEY_PEM_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          from nacl.public import PublicKey, SealedBox

          if not os.environ.get("INSTALLER_KEY"):
              raise SystemExit("MAC_INSTALLER_KEY_PEM_BASE64 is missing")

          request = urllib.request.Request(
              "https://api.github.com/repos/CrispStrobe/CrispChess/actions/secrets/public-key",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request) as response:
              repository_key = json.load(response)

          public_key = PublicKey(base64.b64decode(repository_key["key"]))
          ciphertext = SealedBox(public_key).encrypt(
              os.environ["INSTALLER_KEY"].encode()
          )
          pathlib.Path("crispchess-installer-key.json").write_text(
              json.dumps({
                  "key_id": repository_key["key_id"],
                  "encrypted_value": base64.b64encode(ciphertext).decode(),
              })
          )
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: crispchess-sealed-installer-key
          path: crispchess-installer-key.json
          retention-days: 1
          if-no-files-found: error
