# SPDX-License-Identifier: AGPL-3.0-or-later
# Store screenshots (tasks T-402 / T-403).
#
# Runs the scripted tour in app/integration_test/screenshots_test.dart on iOS
# simulators and on an Android emulator, then makes the result usable without
# anyone downloading a zip:
#
#   ios / android  capture the PNGs and upload them as artifacts
#   publish        force-pushes them, plus a Markdown gallery, to the orphan
#                  branch `screenshots` (main is never touched)
#   appstore       uploads the iOS set to App Store Connect, when ASC_APP_ID is
#                  configured (tools/asc/upload_screenshots.py)
#
# Nothing is ever submitted for review, and there is still no Play upload —
# see docs/release/screenshots.md.
#
# Why `flutter drive` and not `flutter test integration_test/...`:
# IntegrationTestWidgetsFlutterBinding.takeScreenshot() does not write files, it
# returns the PNG bytes to whatever drives the test. Only the `flutter drive`
# adaptor (test_driver/integration_test.dart, integrationDriver(onScreenshot:))
# ever sees them. `flutter test -d <udid>` runs the same test but throws the
# bytes away.
#
# The two capture jobs are deliberately independent (no `needs:`), so an Android
# emulator failure never costs the iOS screenshots and vice versa; `publish`
# takes whichever artifacts exist.
name: screenshots

on:
  workflow_dispatch:
    inputs:
      devices:
        description: 'Comma-separated iOS simulator names to capture'
        type: string
        required: false
        default: 'iPhone 17 Pro Max,iPad Pro 13-inch (M5)'

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'
  BUNDLE_ID: com.crispstrobe.hectopolis

jobs:
  ios:
    name: iOS simulator screenshots
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # A simulator build is debug-only (`Release/Profile mode is not supported
      # for simulators`), so the red DEBUG ribbon is painted unless the app
      # turns it off. Fail here rather than shipping a ribboned screenshot.
      - name: Preflight — no debug banner
        run: |
          set -euo pipefail
          if ! grep -q 'debugShowCheckedModeBanner: *false' app/lib/main.dart; then
            echo "::error file=app/lib/main.dart::MaterialApp must set debugShowCheckedModeBanner: false."
            echo "Simulator/emulator builds are debug-only, so the red DEBUG ribbon would sit in every"
            echo "store screenshot. The flag only has an effect in debug builds, so this is a no-op for"
            echo "released binaries."
            exit 1
          fi

      - name: Toolchain
        run: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          # Flutter 3.44 leaves the Podfile installing the same plugins the SPM
          # references pull in, and the duplicate sources break the build; the
          # release pipeline strips SPM for the same reason.
          flutter config --no-enable-swift-package-manager

      - name: Dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd app
          flutter gen-l10n

      # Resolve the requested simulator names to UDIDs and boot them. `simctl
      # boot` can outlive its own timeout while succeeding, so the state is
      # confirmed with `bootstatus -b` instead of trusting the exit code.
      - name: Resolve the simulators
        env:
          DEVICES: ${{ inputs.devices }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" "$DEVICES" > "$RUNNER_TEMP/simulators.tsv" <<'PY'
          import json, re, sys
          catalogue, requested = sys.argv[1], sys.argv[2]
          runtimes = json.load(open(catalogue))['devices']

          def version(runtime):
              # com.apple.CoreSimulator.SimRuntime.iOS-18-2 -> (18, 2)
              return tuple(int(p) for p in re.findall(r'\d+', runtime.rsplit('.', 1)[-1]))

          available = {}
          for runtime, devices in runtimes.items():
              for device in devices:
                  available.setdefault(device['name'], []).append((version(runtime), runtime, device['udid']))
          missing = []
          def family(n):
              # 'iPhone 17 Pro Max' -> 'iphone pro max', 'iPad Pro 13-inch (M5)' -> 'ipad pro 13-inch'
              n = re.sub(r'\s*\([^)]*\)', '', n)
              n = re.sub(r'\biPhone \d+e?\b', 'iPhone', n)
              return ' '.join(n.lower().split())
          for name in [n.strip() for n in requested.split(',') if n.strip()]:
              if name not in available:
                  # The runner's Xcode moves on (iPhone 16 -> 17, M4 -> M5): fall
                  # back to the newest device of the same family.
                  same = sorted(a for a in available if family(a) == family(name))
                  if not same:
                      missing.append(name)
                      continue
                  print(f'{name} not present, using {same[-1]}', file=sys.stderr)
                  name = same[-1]
              _, runtime, udid = sorted(available[name])[-1]  # newest runtime wins
              print(f'{name}\t{udid}\t{runtime}')
          if missing:
              print('requested simulators not available: ' + ', '.join(missing), file=sys.stderr)
              print('available: ' + ', '.join(sorted(available)), file=sys.stderr)
              sys.exit(1)
          PY
          cat "$RUNNER_TEMP/simulators.tsv"
          # Devices are booted one at a time in the drive step: with two
          # simulators up, flutter drive on the second one never connected
          # (run 33991381211 hung 30 min after "Xcode build done").

      # One `flutter drive` per simulator. The app is uninstalled first: when a
      # fresh build fails, `flutter drive` happily connects to whatever is
      # already installed and drives *that*, producing confidently wrong
      # screenshots of an old binary.
      - name: Drive the tour on each simulator
        id: drive
        working-directory: app
        run: |
          set -euo pipefail
          failed=()
          while IFS=$'\t' read -r name udid runtime; do
            echo "== $name ($udid, $runtime)"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl uninstall "$udid" "$BUNDLE_ID" || true
            # One device at a time, and a hang on one device must not cost the
            # others: 25 minutes is ample for build + tour on a fresh runner.
            SCREENSHOT_DEVICE="$name" flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/screenshots_test.dart \
              -d "$udid" &
            drive_pid=$!
            (sleep 1500; kill -TERM "$drive_pid" 2>/dev/null || true; sleep 10; kill -KILL "$drive_pid" 2>/dev/null || true) &
            watchdog_pid=$!
            if wait "$drive_pid"; then
              echo "== $name: ok"
            else
              echo "::error::$name: flutter drive failed or timed out"
              failed+=("$name")
            fi
            kill "$watchdog_pid" 2>/dev/null || true
            wait "$watchdog_pid" 2>/dev/null || true
            xcrun simctl shutdown "$udid" || true
          done < "$RUNNER_TEMP/simulators.tsv"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::warning::devices without screenshots: ${failed[*]}"
            echo "failed_devices=${failed[*]}" >> "$GITHUB_OUTPUT"
          fi

      # Apple wants 1320x2868 for the 6.9" iPhone set (APP_IPHONE_67) and
      # 2064x2752 for the 13" iPad set (APP_IPAD_PRO_3GEN_129). A simulator of
      # those devices produces exactly those pixel sizes, unscaled — so a
      # mismatch means the wrong device was captured, not that scaling is due.
      - name: Report the captured sizes
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -d screenshots ]; then
            echo "::warning::no screenshots directory"
            exit 0
          fi
          {
            echo "| file | size |"
            echo "|---|---|"
            while IFS= read -r png; do
              w=$(sips -g pixelWidth "$png" | awk '/pixelWidth/ {print $2}')
              h=$(sips -g pixelHeight "$png" | awk '/pixelHeight/ {print $2}')
              echo "| $png | ${w}x${h} |"
            done < <(find screenshots -name '*.png' | sort)
          } >> "$GITHUB_STEP_SUMMARY"
          if ! find screenshots -name '*.png' | grep -q .; then
            echo "::error::the tour produced no PNGs"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-ios
          path: app/screenshots
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS screenshots
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies and localisations
        run: |
          set -euo pipefail
          flutter config --no-enable-swift-package-manager
          flutter pub get
          cd app
          flutter gen-l10n

      - name: Drive the store tour
        working-directory: app
        run: |
          set -euo pipefail
          SCREENSHOT_DEVICE=macOS flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d macos &
          drive_pid=$!
          (sleep 1500; kill -TERM "$drive_pid" 2>/dev/null || true; sleep 10; kill -KILL "$drive_pid" 2>/dev/null || true) &
          watchdog_pid=$!
          status=0
          wait "$drive_pid" || status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          wait "$watchdog_pid" 2>/dev/null || true
          exit "$status"

      - name: Verify Mac App Store dimensions
        working-directory: app
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r png; do
            width=$(sips -g pixelWidth "$png" | awk '/pixelWidth/ {print $2}')
            height=$(sips -g pixelHeight "$png" | awk '/pixelHeight/ {print $2}')
            case "${width}x${height}" in
              1280x800|1440x900|2560x1600|2880x1800) ;;
              *) echo "::error::$png is ${width}x${height}, not a Mac App Store screenshot size"; exit 1 ;;
            esac
            echo "$png ${width}x${height}"
            count=$((count + 1))
          done < <(find screenshots/macos -name '*.png' | sort)
          [ "$count" -eq 12 ] || { echo "::error::expected 12 macOS screenshots, found $count"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: app/screenshots
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android emulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Explicit: a broken Android capture fails this job. It is a separate job
    # with no `needs:`, so the iOS artifact is uploaded either way.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Preflight — no debug banner
        run: |
          set -euo pipefail
          if ! grep -q 'debugShowCheckedModeBanner: *false' app/lib/main.dart; then
            echo "::error file=app/lib/main.dart::MaterialApp must set debugShowCheckedModeBanner: false."
            exit 1
          fi

      - name: Dependencies
        run: |
          set -euo pipefail
          flutter pub get
          cd app
          flutter gen-l10n

      # Without a writable /dev/kvm the x86_64 emulator falls back to software
      # emulation and times out.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Drive the tour on a Pixel 7 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: app
          # On Android takeScreenshot() needs convertFlutterSurfaceToImage(),
          # which the test calls; without a real GPU that only works with the
          # swiftshader renderer selected above.
          # reactivecircus runs every LINE of this script as its own `sh -c`, so
          # no bashisms and no backslash continuations: one command per line.
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb uninstall com.crispstrobe.hectopolis || true
            SCREENSHOT_DEVICE=pixel_7_api34 flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554

      - name: List the captured PNGs
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          if [ ! -d screenshots ]; then
            echo "::warning::no screenshots directory"
            exit 0
          fi
          find screenshots -name '*.png' | sort | while IFS= read -r png; do
            echo "$png $(wc -c < "$png") bytes"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-android
          path: app/screenshots
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------
  # Everything below turns a run into something you can look at and something
  # Apple has, without anyone downloading a zip.
  # ------------------------------------------------------------------------

  # Whatever was captured is force-pushed to the orphan branch `screenshots`
  # (never to main), together with a Markdown gallery, so the images are
  # browsable straight from GitHub and every run replaces the previous set.
  publish:
    name: Publish to the screenshots branch
    runs-on: ubuntu-latest
    needs: [ios, macos, android]
    # `always()` so one dead platform still publishes the other's images; the
    # second half stops a run where *both* failed from wiping the branch.
    if: always() && (needs.ios.result == 'success' || needs.macos.result == 'success' || needs.android.result == 'success')
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      # `merge-multiple: false` keeps each artifact in its own directory, so
      # `incoming/screenshots-ios/<device>/…`; the assembly step flattens the
      # artifact level away and keeps the device level.
      - name: Download whatever artifacts exist
        uses: actions/download-artifact@v4
        with:
          path: incoming
          pattern: screenshots-*
          merge-multiple: false

      - name: Assemble the branch content
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          IOS_RESULT: ${{ needs.ios.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, os, pathlib, re, shutil

          incoming = pathlib.Path("incoming")
          out = pathlib.Path("out")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          env = os.environ
          run_url = f"{env['SERVER_URL']}/{env['REPOSITORY']}/actions/runs/{env['RUN_ID']}"

          # incoming/<artifact>/<device>/<locale>_<nn>_<name>.png -> out/<device>/<file>
          copied = {}
          for png in sorted(incoming.rglob("*.png")):
              device = png.parent.name
              target = out / device / png.name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(png, target)
              copied.setdefault(device, []).append(png.name)
          if not copied:
              raise SystemExit("::error::the artifacts contained no PNGs")

          def stop(name):
              # en_02_map.png -> ('en', 2, '02_map')
              m = re.match(r"^([A-Za-z]+)_(\d+)_(.+)\.png$", name)
              if not m:
                  return (name, 10_000, name)
              return (m.group(1), int(m.group(2)), f"{m.group(2)}_{m.group(3)}")

          lines = [
              "# Hectopolis store screenshots",
              "",
              "Generated by the **screenshots** workflow — every image is a real render of",
              "the real app, captured by `app/integration_test/screenshots_test.dart` on a",
              "simulator or emulator. This branch is force-pushed by each run; do not commit",
              "to it by hand.",
              "",
              "| | |",
              "|---|---|",
              f"| Source commit | `{env['SOURCE_SHA']}` (`{env['SOURCE_REF']}`) |",
              f"| Source run | [{env['RUN_ID']}]({run_url}) (attempt {env['RUN_ATTEMPT']}) |",
              f"| iOS job | `{env['IOS_RESULT']}` |",
              f"| macOS job | `{env['MACOS_RESULT']}` |",
              f"| Android job | `{env['ANDROID_RESULT']}` |",
              f"| Captured | {datetime.datetime.now(datetime.timezone.utc):%Y-%m-%d %H:%M UTC} |",
              f"| Images | {sum(len(v) for v in copied.values())} in {len(copied)} device directories |",
              "",
          ]

          for device in sorted(copied):
              files = sorted(copied[device], key=stop)
              # English first, then the rest alphabetically.
              locales = sorted({stop(f)[0] for f in files}, key=lambda l: (l != "en", l))
              stops = sorted({(stop(f)[1], stop(f)[2]) for f in files})
              lines += [f"## {device}", "", f"`{device}/` — {len(files)} images", ""]
              lines.append("| stop | " + " | ".join(locales) + " |")
              lines.append("|---|" + "---|" * len(locales))
              for _, label in stops:
                  cells = []
                  for locale in locales:
                      name = f"{locale}_{label}.png"
                      if name in files:
                          path = f"{device}/{name}"
                          cells.append(f'<a href="{path}"><img src="{path}" width="200" alt="{name}"></a>')
                      else:
                          cells.append("—")
                  lines.append(f"| `{label}` | " + " | ".join(cells) + " |")
              lines.append("")

          (out / "README.md").write_text("\n".join(lines) + "\n")
          print("\n".join(f"{d}: {len(f)} files" for d, f in sorted(copied.items())))
          PY
          {
            echo "### Screenshots branch"
            echo
            sed -n '/^| |/,/^$/p' out/README.md
          } >> "$GITHUB_STEP_SUMMARY"

      # A throwaway repository with a single commit: the branch has no history
      # to inherit, main is never checked out, and the force-push makes the
      # branch exactly the current set of images.
      - name: Force-push the screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        working-directory: out
        run: |
          set -euo pipefail
          git init -q -b screenshots
          git config user.name 'hectopolis-screenshots[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "screenshots from ${SOURCE_SHA} (run ${RUN_ID})"
          git push --force --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/screenshots
          echo "pushed $(git rev-list --count HEAD) commit to refs/heads/screenshots"
          echo "browse: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/screenshots" >> "$GITHUB_STEP_SUMMARY"

  # Push the Apple-platform captures into their editable App Store versions. Skipped
  # (not failed) when the repo has no ASC_APP_ID, so a fork without secrets
  # still gets a green run.
  appstore:
    name: Upload Apple screenshots to App Store Connect
    runs-on: ubuntu-latest
    needs: [ios, macos]
    if: ${{ always() && (needs.ios.result == 'success' || needs.macos.result == 'success') }}
    timeout-minutes: 30
    # `if: ${{ secrets.X != '' }}` is rejected by GitHub ("Unrecognized named-
    # value: 'secrets'"); the emptiness test has to be copied into an env var
    # first, which a step-level `if` *can* read.
    env:
      HAS_APP_ID: ${{ secrets.ASC_APP_ID != '' }}
      HAS_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 != '' }}
      HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
      HAS_ISSUER: ${{ secrets.ASC_ISSUER_ID != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_APP_ID != 'true'
        run: |
          echo "::notice::ASC_APP_ID is not set — nothing is uploaded to App Store Connect."
          echo "Set the ASC_* secrets (docs/release/ios.md §1) to enable this job." >> "$GITHUB_STEP_SUMMARY"

      # Loud, not silent: a repo that has the app id but not the key is
      # misconfigured, and finding that out here beats finding it out later.
      - name: Preflight — the other API secrets are present
        if: env.HAS_APP_ID == 'true'
        run: |
          set -euo pipefail
          missing=""
          [ "$HAS_KEY" = true ]    || missing="$missing ASC_API_KEY_P8_BASE64"
          [ "$HAS_KEY_ID" = true ] || missing="$missing ASC_KEY_ID"
          [ "$HAS_ISSUER" = true ] || missing="$missing ASC_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::ASC_APP_ID is set but these are missing:$missing — see docs/release/ios.md"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: env.HAS_APP_ID == 'true'

      - uses: actions/setup-python@v5
        if: env.HAS_APP_ID == 'true'
        with:
          python-version: '3.12'

      # tools/asc/client.py signs the ES256 JWT itself and needs nothing else.
      - name: Install the JWT signing dependency
        if: env.HAS_APP_ID == 'true'
        run: python3 -m pip install --quiet --disable-pip-version-check cryptography

      - name: Download the iOS screenshots
        if: env.HAS_APP_ID == 'true' && needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: screenshots-ios
          path: screenshots-ios

      - name: Download the macOS screenshots
        if: env.HAS_APP_ID == 'true' && needs.macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots-macos

      # App Store Connect rejects PNGs with an alpha channel; the Simulator
      # captures RGBA. Flatten onto white in place.
      - name: Flatten the PNGs to RGB
        if: env.HAS_APP_ID == 'true'
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 - <<'PY'
          import glob
          from PIL import Image
          for root in ('screenshots-ios', 'screenshots-macos'):
            for f in sorted(glob.glob(f'{root}/**/*.png', recursive=True)):
              im = Image.open(f)
              if im.mode != 'RGB':
                  bg = Image.new('RGB', im.size, (255, 255, 255))
                  bg.paste(im, mask=im.getchannel('A') if 'A' in im.getbands() else None)
                  bg.save(f, optimize=True)
                  print('flattened', f)
          PY

      # A dry run first: it prints the whole plan (which file goes to which
      # locale, set and position) and the version it found, so a wrong mapping
      # shows up in the log above the write that acted on it.
      - name: Plan the upload
        if: env.HAS_APP_ID == 'true' && needs.ios.result == 'success'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python3 tools/asc/upload_screenshots.py --dry-run --replace screenshots-ios

      - name: Plan the macOS upload
        if: env.HAS_APP_ID == 'true' && needs.macos.result == 'success'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python3 tools/asc/upload_screenshots.py --platform MAC_OS --dry-run --replace screenshots-macos

      # `--replace` empties each set first: re-running the workflow then
      # replaces the store's screenshots instead of appending to them and
      # tripping Apple's ten-per-set limit.
      - name: Upload to App Store Connect
        if: env.HAS_APP_ID == 'true' && needs.ios.result == 'success'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python3 tools/asc/upload_screenshots.py --replace screenshots-ios

      - name: Upload macOS to App Store Connect
        if: env.HAS_APP_ID == 'true' && needs.macos.result == 'success'
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: python3 tools/asc/upload_screenshots.py --platform MAC_OS --replace screenshots-macos

      - name: Summary
        if: env.HAS_APP_ID == 'true'
        run: |
          {
            echo "### App Store Connect"
            echo
            echo "Available iOS and macOS screenshots were uploaded to their editable App Store versions"
            echo "(en-US and de-DE; iPhone, iPad and APP_DESKTOP)."
            echo "**Nothing was submitted for review** — that stays a human decision."
          } >> "$GITHUB_STEP_SUMMARY"
