name: stadtbau_relay
description: >-
  A self-hostable relay for Hectopolis co-op over the internet. It pairs a
  hosting device with its guests by room id and forwards frames it cannot
  read: the game is end-to-end encrypted with the room secret, which the relay
  never sees.
version: 0.1.0
publish_to: none

# Deliberately not a workspace member: the workspace contains the Flutter app,
# and the relay must build with nothing but the Dart SDK (see Dockerfile).
environment:
  sdk: ^3.12.0

dependencies:
  shelf: ^1.4.2
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
