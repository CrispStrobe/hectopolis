name: stadtbau
description: Hectopolis - a tile-placement simulation of urban habitat, ecology and economy.
publish_to: none
version: 0.1.1+4

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^10.1.0
  shared_preferences: ^2.5.0
  stadtbau_sim:
    path: ../packages/stadtbau_sim
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/
