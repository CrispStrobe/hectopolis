name: stadtbau
description: Hectopolis - a tile-placement simulation of urban habitat, ecology and economy.
publish_to: none
version: 0.1.1+5

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  package_info_plus: ^10.1.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.0
  stadtbau_net:
    path: ../packages/stadtbau_net
  stadtbau_sim:
    path: ../packages/stadtbau_sim
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  msix: ^3.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/licenses/
  # Bundled so that no text needs Flutter's font fallback, which downloads
  # Roboto from https://fonts.gstatic.com/s/ on every first load. Apache-2.0,
  # taken from the Flutter SDK's material_fonts artifact; the licence text
  # ships in assets/licenses/Roboto-Apache-2.0.txt.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

# These values describe CI's development package. A Microsoft Store package
# must replace the identity and publisher with the values assigned by Partner
# Center; see docs/release/windows.md.
msix_config:
  display_name: Hectopolis
  publisher_display_name: CrispStrobe
  identity_name: com.crispstrobe.hectopolis
  logo_path: web/icons/Icon-512.png
  architecture: x64
  languages: en-us, de-de
  capabilities: internetClient,privateNetworkClientServer
  build_windows: false
  install_certificate: false
